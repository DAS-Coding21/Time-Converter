<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Converter Page</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="time-converter-bg-container pt-5 pl-4 pb-5">
        <div class="container">
            <div class="row">
                <div class=" col-12 col-md-6 col-lg-5 mt-5">
                     <h1 class="time-converter-heading">Time Converter</h1>
                    <p class="time-converter-para">
                        Enter hours and minutes
                        values to convert into seconds
                    </p>

                    <div class="mb-4">
                        <label for="hoursInput">Hours *</label> <br />
                        <input type="text" id="hoursInput">
                    </div>
                    <div class="mb-4">
                        <label for="minutesInput">Minutes *</label> <br />
                        <input type="text" id="minutesInput">
                    </div>

                    <div class="mt-4">
                        <button class="btn btn-light" id="convertBtn">Convert to Seconds</button>
                    </div>
                    <p id="errorMsg"></p>
                    <p id="timeInSeconds"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
